name: Docker Image CI/CD

on:
  workflow_dispatch:
    inputs:
      VERSION_INCREMENT_MODE:
        description: "Increment mode for version updating. 0 is major, 1 minor, 2 patch."
        type: choice
        required: true
        default: "2"
        options:
          - "0"
          - "1"
          - "2"
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Build and push the Docker image
        env:
          _GITHUB_AUTH_TOKEN: ${{ secrets._GITHUB_AUTH_TOKEN }}
          DOCKER_REGISTRY_USERNAME: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
          VERSION: ${{ vars.VERSION }}
          VERSION_SH: |
            ${{ vars.VERSION_SH }}
          IMAGE_NAME: ${{ vars.IMAGE_NAME }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY }}
        run: |
          echo "$VERSION_SH" | sed 's/\r$//' > version.sh
          chmod +x ./version.sh
          VERSION=$(bash ./version.sh ${{ github.event.inputs.VERSION_INCREMENT_MODE }} $VERSION)
          echo ${VERSION}
          if [ -z $VERSION ]; then
            echo "Please select a container version" 
            exit 1 
          fi
          CURRENT_BRANCH_RAW=$(git branch -r --contains ${{ github.ref }})
          CURRENT_BRANCH=${CURRENT_BRANCH_RAW##*/}
          echo $CURRENT_BRANCH
          if [ $DEFAULT_BRANCH != $CURRENT_BRANCH ]; then
            TAG_BRANCH="${CURRENT_BRANCH}-"
          fi
          FINAL_VERSION_TAG=${TAG_BRANCH}${VERSION}
          CONTAINER_NAME=${IMAGE_NAME}:${FINAL_VERSION_TAG}
          echo "https://api.github.com/repos/${{ github.repository }}/actions/variables/VERSION"
          docker build . --file Dockerfile --build-arg GITHUB_AUTH_TOKEN=$_GITHUB_AUTH_TOKEN --tag ${CONTAINER_NAME}
          docker login -u ${DOCKER_REGISTRY_USERNAME} -p ${DOCKER_REGISTRY_PASSWORD} ${DOCKER_REGISTRY}
          docker push ${CONTAINER_NAME}
          curl -L \
            -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $_GITHUB_AUTH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/variables/VERSION \
            -d "{\"value\":\"${VERSION}\"}"
          echo "FINAL_VERSION_TAG=${FINAL_VERSION_TAG}" >> "$GITHUB_ENV"
      - name: Checkout helm chart
        uses: actions/checkout@v3
        with:
          repository: ${{ vars.CD_REPO }}
          token: ${{ secrets._GITHUB_AUTH_TOKEN }}
          ssh-strict: false
      - name: Change to helm chart values
        uses: fjogeleit/yaml-update-action@main
        with:
          repository: ${{ vars.CD_REPO }}
          token: ${{ secrets._GITHUB_AUTH_TOKEN }}
          branch: main
          targetBranch: main
          masterBranchName: main
          commitChange: true
          valueFile: ${{ vars.CD_FILE_PATH }}
          propertyPath: "image.tag"
          value: ${{ env.FINAL_VERSION_TAG }}
