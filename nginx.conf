user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    sendfile on;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml application/manifest+json;

    server {
        listen 8080;
        listen [::]:8080;

        resolver 127.0.0.11;
        autoindex off;

        server_name _;
        server_tokens off;

        root "/home/user/project/dist";
        gzip_static on;

        # Hashed build assets — safe to cache forever.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Media/fonts keep their names across builds — cache a week.
        location ~* \.(woff2|woff|webp|png|jpe?g|svg|mp3|m4a|wav|ico|gif|mp4)$ {
            expires 7d;
            add_header Cache-Control "public";
        }

        # The icon sprite is a single, non-hashed file loaded at every startup
        # and injected into the DOM. It must always revalidate so a fixed sprite
        # is picked up immediately (exact-match location beats the regex above).
        location = /sprite.svg {
            add_header Cache-Control "no-cache";
        }

        # The HTML entrypoint must always revalidate so new builds are picked up.
        location = /index.html {
            add_header Cache-Control "no-cache";
        }
    }
}
